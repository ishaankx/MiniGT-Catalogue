<!doctype html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="_yR8HPsBNcd06e53BCsz7-UmCMW650RM6udPkIfFNDI" />  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniGT Diecast Catalog - Search Released & Pre-Order Models</title>
  <meta name="description" content="Search the complete MiniGT diecast catalog. Instantly filter by released and pre-order models, search by name or SKU, and browse all categories.">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="images/logo/logo_3.svg" alt="MiniGT logo" class="logo">
    </div>

    <nav class="controls" aria-label="controls">
      <div class="dropdown-wrapper">
        <button id="category-button" class="dropdown-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="lbl">Category:</span>
          <span id="selected-category">All</span>
          <span class="caret">▾</span>
        </button>

        <div id="category-dropdown" class="dropdown" role="dialog" aria-hidden="true" hidden>
          <input id="category-filter" class="dropdown-search" placeholder="Search categories..." aria-label="Search categories" />
          <ul id="category-list" class="dropdown-list" role="listbox" tabindex="-1"></ul>
        </div>
      </div>
      
      <input type="search" id="search-input" class="search-input" placeholder="Search by name or SKU...">
      <div class="status-toggle" role="radiogroup" aria-label="status">
        <button id="btn-released" class="status-btn active" data-status="released" aria-pressed="true">Released</button>
        <button id="btn-preorder" class="status-btn" data-status="preorder" aria-pressed="false">Pre-Order</button>
      </div>
    </nav>
  </header>

  <main>
    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>No cars found</div>
  </main>

  <footer class="site-footer">
  Made with <span class="heart">❤️</span> for this hobby by <strong>Ishaan Katara</strong>
</footer>


  <script src="script.js"></script>
</body>
</html>
